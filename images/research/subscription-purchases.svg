<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="Recurring subscription programs lifting repeat customer purchases">
  <defs>
    <linearGradient id="sp-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf8b97"/>
      <stop offset="1" stop-color="#b06778"/>
    </linearGradient>
    <linearGradient id="sp-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e3bcc2"/>
      <stop offset="1" stop-color="#c17b88"/>
    </linearGradient>
    <filter id="sp-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#a86270" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="300" height="200" rx="18" fill="#faf0f2"/>
  <rect x="0.75" y="0.75" width="298.5" height="198.5" rx="17.25" fill="none" stroke="#ecccd3" stroke-width="1.5"/>

  <!-- Subscription / membership card -->
  <g filter="url(#sp-sh)">
    <rect x="26" y="66" width="108" height="68" rx="11" fill="url(#sp-card)"/>
  </g>
  <rect x="40" y="84" width="22" height="16" rx="3" fill="#f4dde1"/>
  <rect x="44" y="88" width="14" height="8" rx="1.5" fill="#cf8b97"/>
  <rect x="40" y="110" width="80" height="5" rx="2.5" fill="#f1d3d9" opacity="0.9"/>
  <rect x="40" y="120" width="52" height="5" rx="2.5" fill="#eec6cd" opacity="0.8"/>
  <!-- crown badge: premium membership -->
  <g transform="translate(104,70)">
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
    <path d="M-7 3 l-1.5 -9 5 4 3.5 -7 3.5 7 5 -4 -1.5 9 z" fill="#d9b48f"/>
    <rect x="-7" y="4" width="14" height="3" rx="1.5" fill="#d9b48f"/>
  </g>
  <!-- recurring-billing loop -->
  <g transform="translate(80,150)" fill="none" stroke="#8aa896" stroke-width="3" stroke-linecap="round">
    <path d="M-13 0 a13 13 0 1 1 4 9.4"/>
  </g>
  <polygon points="-13,-6 -7,-1 -16,3" transform="translate(80,150)" fill="#8aa896"/>
  <text x="98" y="186" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#6f7e74" text-anchor="middle">recurring</text>

  <!-- flow arrow -->
  <line x1="146" y1="100" x2="172" y2="100" stroke="#a86270" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="172,93 186,100 172,107" fill="#a86270"/>

  <!-- purchases chart panel -->
  <g filter="url(#sp-sh)">
    <rect x="196" y="46" width="88" height="108" rx="12" fill="#ffffff"/>
  </g>
  <line x1="208" y1="138" x2="274" y2="138" stroke="#e7d4d8" stroke-width="2" stroke-linecap="round"/>
  <rect x="212" y="112" width="14" height="26" rx="3" fill="url(#sp-bar)"/>
  <rect x="232" y="96"  width="14" height="42" rx="3" fill="url(#sp-bar)"/>
  <rect x="252" y="76"  width="14" height="62" rx="3" fill="url(#sp-bar)"/>
  <!-- rising trend line -->
  <polyline points="219,108 239,92 259,72" fill="none" stroke="#a86270" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="219" cy="108" r="3" fill="#a86270"/>
  <circle cx="239" cy="92" r="3" fill="#a86270"/>
  <circle cx="259" cy="72" r="3" fill="#a86270"/>
  <!-- shopping bag marker -->
  <g transform="translate(252,52)">
    <path d="M-9 0 h18 l-2 11 h-14 z" fill="#fdeef0" stroke="#a86270" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-4 0 a4 4 0 0 1 8 0" fill="none" stroke="#a86270" stroke-width="2"/>
  </g>
</svg>
